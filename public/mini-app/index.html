<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Euro Save</title><link rel="stylesheet" href="/mini-app/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script defer src="/mini-app/app.js"></script></head><body>
<div class="shell"><header><div class="brand"><span class="logo">€</span><div><strong>Euro Save</strong><small>Расходы под рукой</small></div></div><button id="close" class="quiet">Закрыть ✕</button></header>
<main><div class="heading"><h1 id="title">Обзор расходов</h1><button id="add" class="primary" disabled>＋ Добавить</button></div>
<section id="controls" hidden><div class="toolbar"><div class="segments" aria-label="Период"><button data-period="w">Неделя</button><button data-period="m" class="selected">Месяц</button></div><select id="currency" aria-label="Валюта"></select></div><div class="period"><button id="prev" aria-label="Предыдущий период">‹</button><div><strong id="period-label"></strong><button id="current" class="text-button" hidden>К текущему периоду</button></div><button id="next" aria-label="Следующий период">›</button></div></section>
<p id="status" role="status">Открываем ваши расходы…</p><button id="retry" hidden>Попробовать снова</button><div id="content"></div></main>
<nav aria-label="Основная навигация"><button data-tab="home" class="active"><span>◴</span>Главная</button><button data-tab="categories"><span>◉</span>Категории</button><button data-tab="operations"><span>≡</span>Операции</button></nav></div>
<dialog id="editor"><form id="expense-form"><div class="heading"><h2 id="editor-title">Новый расход</h2><button type="button" id="dismiss" class="quiet" aria-label="Закрыть форму">✕</button></div><label>Магазин или описание<input name="merchant" maxlength="120" required placeholder="Например, LIDL"></label><div class="form-grid"><label>Сумма<input name="amount" type="number" step="0.01" min="0.01" max="9999999999.99" inputmode="decimal" required placeholder="0.00"></label><label>Валюта<input name="currency" maxlength="3" pattern="[A-Za-z]{3}" required value="EUR"></label></div><label>Категория<select name="categoryId" required></select></label><label>Дата и время <small>(часовой пояс устройства)</small><input name="transactionDate" type="datetime-local" required></label><p id="form-error" role="alert"></p><button id="save" class="primary" type="submit">Сохранить расход</button></form></dialog>
</body></html>
